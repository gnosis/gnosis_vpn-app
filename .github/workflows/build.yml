name: Build
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.ref }}-build
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build-binaries:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    strategy:
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-22.04-4 # Depot Ubuntu 22.04, 4 CPUs, 16 GB RAM
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-arm-4 # Depot Ubuntu 22.04 ARM, 4 CPUs, 16 GB RAM
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15 # Depot Apple Silicon M2, 8 CPUs, 24 GB RAM, 400 GB SSD (harden-runner skipped: Linux-only for third-party runners)
            required_label: "binary:aarch64-darwin"
    name: Binary ${{ matrix.architecture }}
    uses: ./.github/workflows/build-binaries.yaml
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      architecture: ${{ matrix.architecture }}
      runner: ${{ matrix.runner }}
      version_type: "commit"
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, 'binary:all') || contains(github.event.pull_request.labels.*.name, matrix.required_label) }}
    secrets: inherit
  checks:
    name: Checks
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@1476429c0d8c5a6331c50a4655501125051cdbf4 # workflow-checks-v2.1.2
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      cachix_cache_name: gnosis-vpn-app
      # No `.#check` app or `.#ci` devshell here; `nix flake check` already covers deno-lint and treefmt.
      format: false
      pre_commit: false
      deps: false
      lint_command: nix flake check -L --show-trace --max-jobs 1
      audit_command: cd src-tauri && nix run -L ..#audit
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  test:
    name: TypeScript Tests
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - name: Install frontend dependencies
        run: deno install
      - name: Run TypeScript tests
        run: deno task test
  ci-ok:
    name: CI OK
    # Single required status check: stable across matrix expansion, label gating and fork guards.
    if: always() # a skipped job counts as passing, so never let a failed dependency skip this one
    needs: [build-binaries, checks, test]
    runs-on: depot-ubuntu-22.04-4
    permissions: {}
    steps:
      - name: Fail if any CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
