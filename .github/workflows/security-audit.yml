name: Security Audit (Deno)

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  deno-audit:
    name: Deno dependency audit (deno.lock)
    runs-on: depot-ubuntu-22.04-4
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "v2.9.8"
          cache: true

      - name: Audit dependencies
        run: deno audit --lock=deno.lock --level=high
