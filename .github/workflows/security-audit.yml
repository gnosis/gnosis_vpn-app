name: Security Audit (Deno + pnpm)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deno-audit:
    name: Deno dependency audit (deno.lock)
    runs-on: depot-ubuntu-22.04-4
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.5"
          cache: true

      - name: Audit dependencies
        run: deno audit --lock=deno.lock --level=high

  pnpm-audit:
    name: Node dependency audit (pnpm)
    runs-on: depot-ubuntu-22.04-4
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pnpm lockfile exists
        id: pnpm_lock
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pnpm_lock.outputs.found == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node.js
        if: steps.pnpm_lock.outputs.found == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.pnpm_lock.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run security audit (prod deps only)
        if: steps.pnpm_lock.outputs.found == 'true'
        run: pnpm audit --audit-level=high --prod

      - name: Run security audit (dev deps, non-blocking)
        if: steps.pnpm_lock.outputs.found == 'true'
        continue-on-error: true
        run: pnpm audit --audit-level=high --dev
