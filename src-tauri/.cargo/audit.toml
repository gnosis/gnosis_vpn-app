# Cargo audit configuration for gnosis_vpn-app; exemptions are a subset of gnosis_vpn-client's.

[advisories]
ignore = [
  "RUSTSEC-2024-0388", # derivative: unmaintained - transitive from alloy ecosystem
  "RUSTSEC-2024-0436", # paste: unmaintained - transitive from alloy-sol-macro
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: timing variability - pinned by elliptic-curve 0.13 via alloy-signer; fixed in >=0.7.6 (0.7.x already updated)
  "RUSTSEC-2026-0118", # hickory-proto: NSEC3 unbounded loop - no fixed version; transitive via libp2p 0.56 → libp2p-mdns
  "RUSTSEC-2026-0119", # hickory-proto: name compression CPU exhaustion - fixed in >=0.26.1, blocked on libp2p
  "RUSTSEC-2026-0487", # hickory-proto: panic on malformed SVCB/HTTPS alpn - fixed in >=0.26.2, blocked on libp2p
  "RUSTSEC-2026-0489", # hickory-proto: panic on single-quote SVCB/HTTPS value - fixed in >=0.26.2, blocked on libp2p
  "RUSTSEC-2026-0490", # hickory-proto: zone file lexer panic on long token - fixed in >=0.26.2, blocked on libp2p
  "RUSTSEC-2026-0491", # hickory-proto: DNS header record-count memory amplification - fixed in >=0.26.2, blocked on libp2p
  "RUSTSEC-2026-0504", # hickory-proto: inverted NSEC3 comparison in DNSSEC validation - no fixed version, blocked on libp2p
  "RUSTSEC-2026-0505", # hickory-proto: NSEC3 owner names not checked against the zone - no fixed version, blocked on libp2p
  "RUSTSEC-2026-0511", # hickory-proto: NXDOMAIN accepted for a proven empty non-terminal - no fixed version, blocked on libp2p
  "RUSTSEC-2026-0512", # hickory-proto: DNSSEC accepted an unrelated signed RRset - no fixed version, blocked on libp2p
  "RUSTSEC-2026-0514", # hickory-resolver: lookup returned records that failed DNSSEC validation - no fixed version, blocked on libp2p
]

[output]
deny = []
quiet = false
show_tree = true
