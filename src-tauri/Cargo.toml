[package]
name = "gnosis_vpn-app"
version = "0.100.1"
description = "Gnosis VPN UI Application"
authors = ["HOPR"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# objc 0.2's msg_send! macro uses cfg(feature = "cargo-clippy") which triggers unexpected_cfgs
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gnosis_vpn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
gnosis_vpn-lib = { git = "https://github.com/gnosis/gnosis_vpn-client.git", branch = "main" }
clap = { version = "4.6.7", features = ["derive", "env"] }
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
dark-light = "2.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
semver = "1.0.28"
tokio = { version = "1.53.3", features = ["time", "rt", "sync", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zstd = "0.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.10", default-features = false }
futures-core = { version = "0.3.34", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
objc = "0.2.7"
dispatch = "0.2"
